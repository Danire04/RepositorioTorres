# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - denuevoT

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: contenedort.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_BB0CAD3D2DB9417C9692758141A90293 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_B70DDC2B63334FE8A8D22F220DC0635C }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: contenedort.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_BB0CAD3D2DB9417C9692758141A90293 }}/miapp:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CDF4C67D8DF54E7290ACB99E367A0B96 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3FEE0B2C7F3E41EAB8D00144F4606B6E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4FD8F187349F467FA2EFC73532F0AD0C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'denuevoT'
          slot-name: 'Production'
          images: 'contenedort.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_BB0CAD3D2DB9417C9692758141A90293 }}/miapp:${{ github.sha }}'
          